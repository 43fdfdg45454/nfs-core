# cargo deny check (CI, job "Supply chain"): known vulnerabilities and yanked versions (RustSec),
# licenses compatible with MIT OR Apache-2.0, and crates only from crates.io and the pinned h3.
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-3-Clause", "Unicode-3.0",
  "Zlib", "CDLA-Permissive-2.0", "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/hyperium/h3"]
