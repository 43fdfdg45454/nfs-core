name: Security

# Beyond the tests and the fuzzing: dependencies with known vulnerabilities or foreign licenses or
# sources, secrets in the history, the workflows themselves, static analysis, and the gateway's
# image. Daily too: advisories appear without the code changing.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny
      - name: Advisories, licenses, sources and bans (deny.toml)
        run: ci/run.sh "Supply chain" cargo deny --locked check

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ci/secrets.sh

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: zizmor (template injection, credentials, permissions, pinning, caches)
        run: |
          pip install --quiet zizmor==1.30.1
          zizmor --offline --format github .github/workflows

  codeql:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  image:
    name: Gateway image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: gateway/Dockerfile
          load: true
          tags: nfs-gateway:scan
          cache-from: type=gha,scope=image-amd64
      - name: Known vulnerabilities with a fix (critical or high)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: nfs-gateway:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
